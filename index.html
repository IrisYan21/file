<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iris Yan - Resume</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 900px;
            width: 100%;
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 60px 40px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 3em;
            margin-bottom: 10px;
            font-weight: 700;
        }
        
        .header p {
            font-size: 1.2em;
            opacity: 0.95;
            margin-bottom: 20px;
        }
        
        .content {
            padding: 60px 40px;
            text-align: center;
        }
        
        .resume-section {
            margin-bottom: 40px;
        }
        
        .resume-section h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5em;
        }
        
        .pdf-viewer {
            border: 2px solid #667eea;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 30px;
            background: #f8f9fa;
        }
        
        .pdf-viewer iframe {
            width: 100%;
            height: 800px;
            border: none;
        }
        
        .button-group {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
        
        .btn {
            display: inline-block;
            padding: 12px 30px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            font-size: 1em;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }
        
        .btn-secondary {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
        }
        
        .btn-secondary:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
        }
        
        .footer {
            background: #f8f9fa;
            padding: 30px;
            text-align: center;
            color: #666;
            border-top: 1px solid #e0e0e0;
        }
        
        @media (max-width: 768px) {
            .header {
                padding: 40px 20px;
            }
            
            .header h1 {
                font-size: 2em;
            }
            
            .content {
                padding: 30px 20px;
            }
            
            .pdf-viewer iframe {
                height: 600px;
            }
            
            .button-group {
                flex-direction: column;
            }
            
            .btn {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Iris Yan</h1>
            <p>Product Designer | TikTok</p>
        </div>
        
        <div class="content">
            <div class="resume-section">
                <h2>My Resume</h2>
                <div class="pdf-viewer">
                    <iframe src="https://github.com/IrisYan21/file/blob/main/Iris%20Yan_Resume.pdf"></iframe>
                </div>
            </div>
            
            <div class="button-group">
                <a href="https://github.com/IrisYan21/file/raw/main/Iris%20Yan_Resume.pdf" class="btn btn-primary" download>Download PDF</a>
                <a href="https://www.linkedin.com/in/iris-yan-845534210" class="btn btn-secondary" target="_blank">LinkedIn Profile</a>
                <a href="https://www.danchangyan.com" class="btn btn-secondary" target="_blank">Portfolio</a>
            </div>
        </div>
        
        <div class="footer">
            <p>&copy; 2024 Iris Yan. All rights reserved.</p>
        </div>
    </div>
</body>
</html>

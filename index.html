<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iris Yan - Resume</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f5f5;
            height: 100vh;
            overflow: hidden;
        }
        
        .top-bar {
            background: white;
            padding: 15px 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
        }
        
        .title {
            font-size: 1.3em;
            font-weight: 600;
            color: #333;
        }
        
        .controls {
            display: flex;
            gap: 10px;
        }
        
        .btn {
            padding: 8px 16px;
            border-radius: 4px;
            border: none;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.95em;
        }
        
        .btn-download {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        
        .btn-download:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn-link {
            background: #f0f0f0;
            color: #333;
            text-decoration: none;
        }
        
        .btn-link:hover {
            background: #e0e0e0;
        }
        
        .pdf-container {
            width: 100%;
            height: calc(100vh - 60px);
            overflow: auto;
        }
        
        .pdf-container iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
        
        @media (max-width: 768px) {
            .top-bar {
                flex-direction: column;
                gap: 10px;
            }
            
            .controls {
                width: 100%;
                justify-content: center;
            }
            
            .btn {
                flex: 1;
                text-align: center;
            }
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <div class="title">Iris Yan - Resume (Product Designer, TikTok)</div>
        <div class="controls">
            <a href="https://raw.githubusercontent.com/IrisYan21/file/main/Iris%20Yan_Resume.pdf" download class="btn btn-download">📥 Download PDF</a>
            <a href="https://www.linkedin.com/in/iris-yan-845534210" target="_blank" class="btn btn-link">LinkedIn</a>
            <a href="https://www.danchangyan.com" target="_blank" class="btn btn-link">Portfolio</a>
        </div>
    </div>
    
    <div class="pdf-container">
        <iframe src="https://raw.githubusercontent.com/IrisYan21/file/main/Iris%20Yan_Resume.pdf"></iframe>
    </div>
</body>
</html>
